<div [formGroup]="entityForm!">
  <div [formGroupName]="parentField!">
    <div class="mb-3">
      <label class="form-label" *ngIf="fieldValue!.field.displayName">
        {{ fieldValue!.field.displayName }}
      </label>
      <input
        type="text"
        class="form-control"
        [formControlName]="fieldValue!.field.name"
        [placeholder]="fieldValue!.field.configuration['Tags.Placeholder']"
      />
    </div>
  </div>
</div>
