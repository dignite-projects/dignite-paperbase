@if (showInList) {
  {{ tags.join(', ') }}
} @else {
  <div class="mb-3">
    @if (fields?.field?.displayName) {
      <label class="form-label">
        {{ fields!.field.displayName }}
      </label>
    }
    <div>
      @for (tag of tags; track tag) {
        <span class="badge bg-light text-dark border me-1">{{ tag }}</span>
      } @empty {
        <span class="text-muted">-</span>
      }
    </div>
  </div>
}
