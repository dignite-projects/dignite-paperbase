<div class="mb-3">
  @if (fieldValue?.field?.displayName) {
    <label class="form-label">
      {{ fieldValue!.field.displayName }}
    </label>
  }
  <nz-select
    class="w-100"
    nzMode="tags"
    [nzTokenSeparators]="tokenSeparators"
    [nzMaxMultipleCount]="maxCount"
    [nzPlaceHolder]="placeholder"
    [formControl]="valueControl"
  ></nz-select>
  @if (fieldValue?.field?.description) {
    <small class="form-text text-muted d-block">
      {{ fieldValue!.field.description }}
    </small>
  }
</div>
