# Release workflow. The version is read from <Version> in common.props (the single source of
# truth); a pushed v* tag must match it (guard step below), but tags do not drive the number.
#
# Routing by channel, derived from the SemVer pre-release suffix in <Version>:
#   - Pre-release (e.g. 0.2.0-preview.3) -> NuGet + npm packages pushed to GitHub Packages only.
#   - Stable      (e.g. 0.2.0)           -> NuGet to NuGet.org, npm (@dignite/vault-extract) to npmjs.
#
# Triggers: push a v* tag (e.g. v0.2.0 or v0.2.0-preview.3) or use workflow_dispatch. For churny
# pre-release builds prefer workflow_dispatch: no tag, no draft Release, no lockstep check - just
# bump <Version> in common.props (and angular/projects/vault-extract/package.json to match), run,
# and the packages land in GitHub Packages.
#
# The npm version in angular/projects/vault-extract/package.json must stay in lockstep with common.props
# <Version> (enforced by the guard step on tag pushes).

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required by softprops/action-gh-release to create a draft Release
      packages: write # Required to push pre-release NuGet/npm packages to GitHub Packages

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Fail fast when the tag, common.props <Version>, and the npm package version disagree.
      # common.props is the truth source; CONTRIBUTING.md ("Where the version lives") requires
      # the npm version to stay in lockstep with it.
      - name: Verify tag and version lockstep
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' common.props | head -n1)
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match <Version>$VERSION</Version> in common.props."
            exit 1
          fi
          NPM_VERSION=$(node -p "require('./angular/projects/vault-extract/package.json').version")
          if [ "$NPM_VERSION" != "$VERSION" ]; then
            echo "::error::npm version $NPM_VERSION (angular/projects/vault-extract/package.json) is not in lockstep with common.props $VERSION."
            exit 1
          fi

      # Derive the release channel from the SemVer pre-release suffix in common.props <Version>:
      # a hyphen (0.2.0-preview.3) routes packages to GitHub Packages only; a clean version
      # (0.2.0) is a stable release that goes to NuGet.org / npmjs. Runs on every trigger.
      - name: Determine release channel
        id: channel
        run: |
          VERSION=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' common.props | head -n1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "channel=preview" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION is a pre-release -> GitHub Packages only."
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION is stable -> NuGet.org / npmjs."
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # NuGet.Config routes Dignite.Abp.FlexFields.* to GitHub Packages, which needs auth even for
      # public packages. The built-in GITHUB_TOKEN cannot be used: it grants packages:read only for
      # packages published by THIS repository, never for a sibling repo in the same org - and
      # Dignite.Abp.FlexFields.* ships from abp-modules/flex-fields. Same real PAT ci.yml uses;
      # commit 4309740c fixed this in ci.yml only and did not reach here.
      - name: Restore
        run: dotnet restore Dignite.Vault.Extract.slnx
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      - name: Build
        run: dotnet build Dignite.Vault.Extract.slnx --no-restore --configuration Release

      # Same backend test set as ci.yml; all are dependency-light
      # (SQLite in-memory / mocks / minimal TestServer).
      - name: Run domain tests
        run: dotnet test core/test/Dignite.Vault.Extract.Domain.Tests/Dignite.Vault.Extract.Domain.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Run application tests
        run: dotnet test core/test/Dignite.Vault.Extract.Application.Tests/Dignite.Vault.Extract.Application.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Run EF Core tests
        run: dotnet test core/test/Dignite.Vault.Extract.EntityFrameworkCore.Tests/Dignite.Vault.Extract.EntityFrameworkCore.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Run MCP tests
        run: dotnet test core/test/Dignite.Vault.Extract.Mcp.Tests/Dignite.Vault.Extract.Mcp.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Run OCR VisionLlm tests
        run: dotnet test core/test/Dignite.Vault.Extract.Ocr.VisionLlm.Tests/Dignite.Vault.Extract.Ocr.VisionLlm.Tests.csproj --no-build --configuration Release --verbosity normal

      # Projects with IsPackable=false (host / test projects; test projects are implicitly false
      # via Microsoft.NET.Test.Sdk) are skipped automatically. Only NuGet packages under core/src
      # are produced. common.props embeds each PDB in its DLL (DebugType=embedded), so pack emits
      # no separate .snupkg symbol package.
      - name: Pack
        run: dotnet pack Dignite.Vault.Extract.slnx --no-build --configuration Release -o ./artifacts

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: error

      # Pre-release builds go to GitHub Packages only (private to the org, authenticated with the
      # workflow's built-in GITHUB_TOKEN). The package's <RepositoryUrl> in common.props links it
      # to dignite-projects/vault-extract, which GitHub Packages requires for the push. Symbols are
      # embedded in the DLLs, so ./artifacts holds only .nupkg files and the push is .nupkg-only.
      - name: Push to GitHub Packages (pre-release)
        if: steps.channel.outputs.channel == 'preview'
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --source https://nuget.pkg.github.com/dignite-projects/index.json \
            --skip-duplicate

      # Stable builds go to the public NuGet.org. Secrets cannot be referenced directly in if:
      # expressions, so inject through env and check in the shell; skip the push when not configured.
      - name: Push to NuGet.org (stable)
        if: steps.channel.outputs.channel == 'stable'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::notice::NUGET_API_KEY secret is not configured; skipping NuGet.org push (packages were uploaded as workflow artifacts)."
            exit 0
          fi
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # angular/.npmrc routes @dignite-projects:* to GitHub Packages and reads the credential from
      # the plain GITHUB_TOKEN env var (npm's own ${VAR} substitution, not a GitHub Actions
      # expression). Cross-repo access, so the default job token is not enough - same real PAT the
      # CI workflow uses. Without this the install fails E401 on @dignite-projects/ng.flex-fields.
      - name: Install Angular dependencies
        run: npm ci
        working-directory: angular
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      - name: Build npm package
        run: npx ng build vault-extract --configuration production
        working-directory: angular

      # Pack the built library into a versioned .tgz next to the .nupkg files in ./artifacts, so a
      # single release run always emits both backend (NuGet) and frontend (npm) packages. Pre-release
      # UI libs are not published to any npm registry (see the stable-only publish step below); this
      # tarball is the artifact downstream verticals pin as a `file:` dependency.
      - name: Pack npm tarball
        run: npm pack ./dist/vault-extract --pack-destination ../artifacts
        working-directory: angular

      - name: Upload npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: artifacts/*.tgz
          if-no-files-found: error

      # Pre-release UI packages go to GitHub Packages, the npm mirror of the pre-release NuGet push
      # above. GitHub Packages' npm registry rejects any scope that does not match the owning org,
      # so @dignite/vault-extract cannot be pushed there under its real name - the public @dignite/*
      # scope belongs to npmjs (stable releases, below). The rename happens in a scratch copy of the
      # packed tarball so the working tree and the npmjs artifact keep the public name.
      #
      # Every @dignite/* dependency needs the same scope swap: the packed package.json names
      # "@dignite/ng.flex-fields", which only exists on npmjs once flex-fields ships a stable
      # release - today only @dignite-projects/* does. Rewritten to the npm alias form rather than a
      # plain key rename, so the dependency still installs under the name the compiled bundle's bare
      # specifiers import while resolving from @dignite-projects. angular/package.json uses the same
      # alias for this workspace's own build. Mirrors site's release workflow, which solved this first.
      - name: Publish pre-release Angular package to GitHub Packages
        if: steps.channel.outputs.channel == 'preview'
        run: |
          echo "@dignite-projects:registry=https://npm.pkg.github.com" >> "$NPM_CONFIG_USERCONFIG"
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> "$NPM_CONFIG_USERCONFIG"
          tarball="../artifacts/dignite-vault-extract-${{ steps.channel.outputs.version }}.tgz"
          workdir=$(mktemp -d)
          tar -xzf "$tarball" -C "$workdir"
          npm pkg set name="@dignite-projects/vault-extract" --prefix "$workdir/package"
          PKG_DIR="$workdir/package" node -e '
            const fs = require("fs");
            const path = require("path");
            const pkgPath = path.join(process.env.PKG_DIR, "package.json");
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            for (const [name, range] of Object.entries(pkg.dependencies || {})) {
              if (name.startsWith("@dignite/")) {
                pkg.dependencies[name] = `npm:@dignite-projects/${name.slice("@dignite/".length)}@${range}`;
              }
            }
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
          '
          # npm publish has no --skip-duplicate equivalent (unlike the dotnet nuget push calls
          # above); re-dispatching at an unchanged pre-release version is expected and should not
          # fail the run, so treat "already published" as a soft skip and let anything else fail.
          #
          # Redirect rather than `| tee`: the step shell is `bash -e` with no pipefail, so a
          # pipeline's status is tee's (always 0) and a failed publish would report success. That
          # is not hypothetical - it is exactly how run 33594399735 reported a green step while
          # npm had returned E401.
          set +e
          npm publish "$workdir/package" --registry https://npm.pkg.github.com > /tmp/npm-publish.log 2>&1
          status=$?
          set -e
          cat /tmp/npm-publish.log
          if [ $status -ne 0 ]; then
            if grep -q 'Cannot publish over existing version' /tmp/npm-publish.log; then
              echo "::notice::@dignite-projects/vault-extract@${{ steps.channel.outputs.version }} is already published; skipping."
            else
              exit $status
            fi
          fi
        working-directory: angular
        # angular/.npmrc reads ${GITHUB_TOKEN} for the @dignite-projects scope, and a project-level
        # .npmrc outranks the user-level file this step appends to. Without this the placeholder
        # resolves empty and silently overrides the token written above - the E401 in that same run.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Stable releases carry the public @dignite/* name to npmjs. Note this still requires every
      # @dignite/* dependency to exist there: @dignite/ng.flex-fields does not yet (flex-fields
      # publishes pre-releases to GitHub Packages only), so a stable npm release is gated on that -
      # tracked in #577.
      - name: Publish to npm (stable)
        if: steps.channel.outputs.channel == 'stable'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN secret is not configured; skipping npm publish."
            exit 0
          fi
          npm publish ./dist/vault-extract --access public
        working-directory: angular

      # Extract this version's section from CHANGELOG.md as the draft release body. The heading
      # line is dropped (the release title already carries the version). Missing section is a
      # warning, not an error: the draft is reviewed by a human who can still write the body.
      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]") > 0) found = 1; next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG.md has no section for $VERSION; the draft release body will be empty - fill it in before publishing."
          fi

      # Create a draft Release only on tag pushes (workflow_dispatch has no tag context).
      # The body is pre-filled from CHANGELOG.md; review the draft before publishing.
      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ steps.channel.outputs.channel == 'preview' }}
          body_path: release-notes.md
          # Attach both the NuGet packages (.nupkg) and the npm tarball (.tgz) to the draft Release.
          files: artifacts/*
