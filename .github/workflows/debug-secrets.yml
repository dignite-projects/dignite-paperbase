name: Debug Secrets

on:
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret lengths
        env:
          A: ${{ secrets.PACKAGES_READ_TOKEN }}
          B: ${{ secrets.NPM_TOKEN }}
          C: ${{ secrets.NUGET_API_KEY }}
          D: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "PACKAGES_READ_TOKEN length: ${#A}"
          echo "NPM_TOKEN length: ${#B}"
          echo "NUGET_API_KEY length: ${#C}"
          echo "GITHUB_TOKEN length: ${#D}"